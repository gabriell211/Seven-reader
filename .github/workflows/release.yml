name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2025
            args: "--bundles nsis"
          - platform: ubuntu-24.04
            args: "--bundles appimage,deb,rpm"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - run: npm install --no-audit --no-fund
      - run: npm run build:assets
      - run: npm run fetch:pdfium

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Seven Reader ${{ github.ref_name }}"
          releaseBody: |
            Instaladores oficiais do Seven Reader.

            - Windows: NSIS x64 com associação .pdf e identidade Seven.
            - Linux: AppImage, DEB e RPM.
            - PDFium incluído para renderização local.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
