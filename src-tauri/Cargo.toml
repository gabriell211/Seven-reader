[package]
name = "seven-reader"
version = "0.1.0"
description = "Seven Reader desktop PDF suite"
authors = ["gabriell211"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "seven_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
which = "8"
pdfium-render = { version = "0.9.4", features = ["image_latest"] }
lopdf = { version = "0.38", features = ["embed_image"] }
sha2 = "0.10"
hex = "0.4"
image = "0.25"
underskrift = "0.1.4"
encoding_rs = "0.8"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"
panic = "abort"
